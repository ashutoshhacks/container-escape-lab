<!DOCTYPE html>
<html>
<head>
    <title>Network Ping Utility</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; }
        input { padding: 8px; width: 300px; border: 1px solid #ccc; }
        button { padding: 8px 16px; background: #007bff; color: white; border: none; cursor: pointer; }
        pre { background: #1e1e1e; color: #00ff00; padding: 16px; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Network Ping Utility</h2>
    <p>Enter an IP address or hostname to ping:</p>

    <!-- Form submits to /ping via POST -->
    <form action="/ping" method="post">
        <input type="text" name="target" placeholder="e.g. 8.8.8.8" required />
        <button type="submit">Ping</button>
    </form>

    <!-- Show command output if available -->
    {% if output %}
        <h3>Output:</h3>
        <pre>{{ output }}</pre>
    {% endif %}
</body>
</html>
