<!DOCTYPE html>
<html>
<head>
    <title>Network Ping Utility (Hardened)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; }
        input { padding: 8px; width: 300px; border: 1px solid #ccc; }
        button { padding: 8px 16px; background: #28a745; color: white; border: none; cursor: pointer; }
        pre { background: #1e1e1e; color: #00ff00; padding: 16px; border-radius: 4px; }
        .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 4px; }
        .badge { background: #28a745; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <h2>Network Ping Utility <span class="badge">HARDENED</span></h2>
    <p>Enter an IPv4 address to ping:</p>

    <form action="/ping" method="post">
        <input type="text" name="target" placeholder="e.g. 8.8.8.8" required />
        <button type="submit">Ping</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if output %}
        <h3>Output:</h3>
        <pre>{{ output }}</pre>
    {% endif %}
</body>
</html>
